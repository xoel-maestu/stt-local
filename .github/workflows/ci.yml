name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x stt.sh modules/*.sh lib/*.sh tests/*.sh

  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "fedora:43", "debian:13", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - run: tests/distro.sh "${{ matrix.image }}"
